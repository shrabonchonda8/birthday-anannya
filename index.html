<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chess Game</title>

<!-- CSS file -->
<link rel="stylesheet" href="style.css">

</head><body><!-- =========================
     CHESS GAME CONTAINER
========================== -->

<div class="game-container">

    <!-- Game Header -->
    <header class="game-header">

        <div class="logo">
            ♟ CHESS
        </div>

        <div class="game-status">
            <span id="turnText">White's Turn</span>
        </div>

        <button id="newGameBtn">
            New Game
        </button>

    </header>


    <!-- =========================
         PLAYER BLACK
    ========================== -->

    <section class="player player-black">

        <div class="player-info">

            <div class="player-avatar">
                ♚
            </div>

            <div>
                <h3 id="blackPlayerName">
                    Black
                </h3>

                <span id="blackStatus">
                    Playing
                </span>
            </div>

        </div>

        <!-- Black Timer -->
        <div class="timer" id="blackTimer">
            10:00
        </div>

    </section>


    <!-- =========================
         CHESS BOARD
    ========================== -->

    <main class="board-container">

        <!-- Coordinates / Board -->
        <div
            id="chessBoard"
            class="chess-board"
            aria-label="Chess Board"
        >

            <!--
                JavaScript will create
                all 64 squares here.
            -->

        </div>

    </main>


    <!-- =========================
         PLAYER WHITE
    ========================== -->

    <section class="player player-white">

        <div class="player-info">

            <div class="player-avatar">
                ♔
            </div>

            <div>
                <h3 id="whitePlayerName">
                    White
                </h3>

                <span id="whiteStatus">
                    Playing
                </span>
            </div>

        </div>

        <!-- White Timer -->
        <div class="timer" id="whiteTimer">
            10:00
        </div>

    </section>


    <!-- =========================
         GAME CONTROLS
    ========================== -->

    <section class="game-controls">

        <button id="undoBtn">
            ↶ Undo
        </button>

        <button id="flipBoardBtn">
            ⇅ Flip Board
        </button>

        <button id="drawBtn">
            ½ Draw
        </button>

        <button id="resignBtn">
            ⚑ Resign
        </button>

    </section>


    <!-- =========================
         MOVE HISTORY
    ========================== -->

    <section class="move-history">

        <div class="section-title">
            <h2>Move History</h2>

            <button id="clearHistoryBtn">
                Clear
            </button>
        </div>

        <div
            id="moveHistory"
            class="moves"
        >

            <!--
                JavaScript will add
                moves here.
            -->

            <p class="empty-history">
                No moves yet
            </p>

        </div>

    </section>


    <!-- =========================
         GAME MESSAGE
    ========================== -->

    <div
        id="gameMessage"
        class="game-message hidden"
    >

        <div class="message-box">

            <div
                id="messageIcon"
                class="message-icon"
            >
                ♕
            </div>

            <h2 id="messageTitle">
                Game Over
            </h2>

            <p id="messageText">
                White wins!
            </p>

            <button id="playAgainBtn">
                Play Again
            </button>

        </div>

    </div>


</div>


<!-- =========================
     PROMOTION MODAL
========================== -->

<div
    id="promotionModal"
    class="modal hidden"
>

    <div class="promotion-box">

        <h2>
            Choose Promotion
        </h2>

        <div class="promotion-pieces">

            <button
                class="promotion-btn"
                data-piece="queen"
            >
                ♕
            </button>

            <button
                class="promotion-btn"
                data-piece="rook"
            >
                ♖
            </button>

            <button
                class="promotion-btn"
                data-piece="bishop"
            >
                ♗
            </button>

            <button
                class="promotion-btn"
                data-piece="knight"
            >
                ♘
            </button>

        </div>

    </div>

</div>


<!-- =========================
     DRAW OFFER MODAL
========================== -->

<div
    id="drawModal"
    class="modal hidden"
>

    <div class="draw-box">

        <h2>
            Draw Offer
        </h2>

        <p>
            Your opponent offered a draw.
        </p>

        <div class="modal-buttons">

            <button id="acceptDrawBtn">
                Accept
            </button>

            <button id="rejectDrawBtn">
                Reject
            </button>

        </div>

    </div>

</div>


<!-- =========================
     CONFIRM RESIGN MODAL
========================== -->

<div
    id="resignModal"
    class="modal hidden"
>

    <div class="resign-box">

        <h2>
            Resign Game?
        </h2>

        <p>
            Are you sure you want to resign?
        </p>

        <div class="modal-buttons">

            <button id="confirmResignBtn">
                Resign
            </button>

            <button id="cancelResignBtn">
                Cancel
            </button>

        </div>

    </div>

</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script src="main.js"></script>

</body>
</html>
