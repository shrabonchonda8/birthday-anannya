<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tic Tac Toe</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 95%;
    max-width: 420px;
    text-align: center;
}

h1 {
    font-size: 38px;
    margin-bottom: 8px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 20px;
}

.menu {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}

.menu button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 15px;
}

.menu button.active {
    background: #00d26a;
    color: black;
    font-weight: bold;
}

.score {
    display: flex;
    justify-content: space-around;
    background: #1b1b1b;
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 18px;
}

.score div {
    font-size: 15px;
}

.score b {
    font-size: 20px;
}

.status {
    font-size: 19px;
    margin-bottom: 15px;
    min-height: 24px;
}

/* GAME BOARD */

.board {
    width: 100%;
    max-width: 390px;
    aspect-ratio: 1 / 1;
    margin: auto;
    position: relative;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
}

.cell {
    border: none;
    border-radius: 14px;
    background: #292929;

    color: white;
    font-size: 58px;
    font-weight: bold;

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;
    z-index: 1;
}

.cell.x {
    color: #ff5252;
}

.cell.o {
    color: #40bfff;
}

/* WINNING LINE */

.win-line {
    position: absolute;

    height: 7px;
    background: #168cff;

    border-radius: 10px;

    z-index: 5;

    transform-origin: left center;

    box-shadow: 0 0 10px #168cff,
                0 0 20px #168cff;

    animation: lineAppear 0.45s ease-out;
}

@keyframes lineAppear {
    from {
        width: 0;
    }
    to {
        width: 100%;
    }
}

.restart {
    width: 100%;
    max-width: 390px;

    margin-top: 18px;

    padding: 14px;

    border: none;
    border-radius: 12px;

    background: #00d26a;
    color: black;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
}

.restart:active {
    transform: scale(0.97);
}
</style>
</head>

<body>

<div class="game">

    <h1>⭕ Tic Tac Toe ❌</h1>

    <div class="subtitle">
        Choose your game mode
    </div>

    <div class="menu">

        <button id="computerBtn" class="active">
            🤖 Computer
        </button>

        <button id="twoPlayerBtn">
            👥 2 Players
        </button>

    </div>

    <div class="score">

        <div>
            ❌ You/P1<br>
            <b id="xScore">0</b>
        </div>

        <div>
            🤝 Draw<br>
            <b id="drawScore">0</b>
        </div>

        <div>
            ⭕ O/Computer<br>
            <b id="oScore">0</b>
        </div>

    </div>

    <div id="status" class="status">
        Your turn — ❌
    </div>


    <div id="board" class="board">

        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>

        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>

        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>

        <!-- Winning line -->
        <div id="winLine" class="win-line"></div>

    </div>


    <button class="restart" id="restartBtn">
        🔄 Restart Game
    </button>

</div>


<script>

const cells = document.querySelectorAll(".cell");

const boardElement = document.getElementById("board");

const winLine = document.getElementById("winLine");

const statusText = document.getElementById("status");

const computerBtn = document.getElementById("computerBtn");

const twoPlayerBtn = document.getElementById("twoPlayerBtn");

const restartBtn = document.getElementById("restartBtn");

const xScoreText = document.getElementById("xScore");

const oScoreText = document.getElementById("oScore");

const drawScoreText = document.getElementById("drawScore");


let board = [
    "", "", "",
    "", "", "",
    "", "", ""
];

let currentPlayer = "X";

let gameOver = false;

let mode = "computer";

let xScore = 0;
let oScore = 0;
let drawScore = 0;


/* WINNING PATTERNS */

const winningPatterns = [

    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],

    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],

    [0, 4, 8],
    [2, 4, 6]

];


/* CLICK CELL */

cells.forEach((cell, index) => {

    cell.addEventListener("click", () => {

        if (gameOver) return;

        if (board[index] !== "") return;


        if (mode === "computer") {

            if (currentPlayer !== "X") return;

            makeMove(index, "X");

            if (!gameOver) {

                currentPlayer = "O";

                statusText.innerText =
                    "Computer is thinking... 🤖";

                setTimeout(computerMove, 450);

            }

        }

        else {

            makeMove(index, currentPlayer);

            if (!gameOver) {

                currentPlayer =
                    currentPlayer === "X" ? "O" : "X";

                statusText.innerText =
                    "Player " + currentPlayer + " turn";

            }

        }

    });

});


/* MAKE MOVE */

function makeMove(index, player) {

    board[index] = player;

    updateBoard();

    checkGame();

}


/* UPDATE BOARD */

function updateBoard() {

    cells.forEach((cell, index) => {

        cell.innerText = board[index];

        cell.classList.remove("x", "o");

        if (board[index] === "X") {

            cell.classList.add("x");

        }

        if (board[index] === "O") {

            cell.classList.add("o");

        }

    });

}


/* COMPUTER */

function computerMove() {

    if (gameOver) return;


    let emptyCells = [];

    for (let i = 0; i < board.length; i++) {

        if (board[i] === "") {

            emptyCells.push(i);

        }

    }


    if (emptyCells.length === 0) return;


    /*
       Simple computer AI:
       First try to win
    */

    let move = findWinningMove("O");


    /*
       Then block player
    */

    if (move === -1) {

        move = findWinningMove("X");

    }


    /*
       Then center
    */

    if (move === -1 && board[4] === "") {

        move = 4;

    }


    /*
       Otherwise random
    */

    if (move === -1) {

        move =
            emptyCells[
                Math.floor(
                    Math.random() * emptyCells.length
                )
            ];

    }


    makeMove(move, "O");


    if (!gameOver) {

        currentPlayer = "X";

        statusText.innerText =
            "Your turn — ❌";

    }

}


/* FIND WINNING MOVE */

function findWinningMove(player) {

    for (let pattern of winningPatterns) {

        const [a, b, c] = pattern;

        let values = [
            board[a],
            board[b],
            board[c]
        ];


        if (
            values.filter(v => v === player).length === 2 &&
            values.includes("")
        ) {

            if (board[a] === "") return a;

            if (board[b] === "") return b;

            if (board[c] === "") return c;

        }

    }

    return -1;

}


/* CHECK GAME */

function checkGame() {

    for (let i = 0; i < winningPatterns.length; i++) {

        const pattern = winningPatterns[i];

        const [a, b, c] = pattern;


        if (
            board[a] !== "" &&
            board[a] === board[b] &&
            board[a] === board[c]
        ) {

            gameOver = true;


            let winner = board[a];


            if (winner === "X") {

                xScore++;

                xScoreText.innerText = xScore;

                if (mode === "computer") {

                    statusText.innerText =
                        "🎉 You Win!";

                } else {

                    statusText.innerText =
                        "🎉 Player X Wins!";

                }

            }


            if (winner === "O") {

                oScore++;

                oScoreText.innerText = oScore;

                if (mode === "computer") {

                    statusText.innerText =
                        "🤖 Computer Wins!";

                } else {

                    statusText.innerText =
                        "🎉 Player O Wins!";

                }

            }


            /* SHOW BLUE WINNING LINE */

            showWinningLine(pattern);

            return;

        }

    }


    /* DRAW */

    if (!board.includes("")) {

        gameOver = true;

        drawScore++;

        drawScoreText.innerText =
            drawScore;

        statusText.innerText =
            "🤝 It's a Draw!";

    }

}


/* WINNING LINE */

function showWinningLine(pattern) {

    const [a, b, c] = pattern;


    const boardRect =
        boardElement.getBoundingClientRect();


    const firstRect =
        cells[a].getBoundingClientRect();


    const lastRect =
        cells[c].getBoundingClientRect();


    const startX =
        firstRect.left +
        firstRect.width / 2 -
        boardRect.left;


    const startY =
        firstRect.top +
        firstRect.height / 2 -
        boardRect.top;


    const endX =
        lastRect.left +
        lastRect.width / 2 -
        boardRect.left;


    const endY =
        lastRect.top +
        lastRect.height / 2 -
        boardRect.top;


    const dx = endX - startX;

    const dy = endY - startY;


    const distance =
        Math.sqrt(dx * dx + dy * dy);


    const angle =
        Math.atan2(dy, dx) *
        180 /
        Math.PI;


    winLine.style.left =
        startX + "px";


    winLine.style.top =
        startY + "px";


    winLine.style.width =
        distance + "px";


    winLine.style.transform =
        "rotate(" + angle + "deg)";


    winLine.style.display =
        "block";

}


/* HIDE LINE */

function hideWinningLine() {

    winLine.style.display =
        "none";

}


/* RESTART */

function restartGame() {

    board = [
        "", "", "",
        "", "", "",
        "", "", ""
    ];

    currentPlayer = "X";

    gameOver = false;


    hideWinningLine();


    cells.forEach(cell => {

        cell.innerText = "";

        cell.classList.remove("x", "o");

    });


    if (mode === "computer") {

        statusText.innerText =
            "Your turn — ❌";

    } else {

        statusText.innerText =
            "Player X turn";

    }

}


/* COMPUTER MODE */

computerBtn.addEventListener("click", () => {

    mode = "computer";

    computerBtn.classList.add("active");

    twoPlayerBtn.classList.remove("active");

    restartGame();

});


/* 2 PLAYER MODE */

twoPlayerBtn.addEventListener("click", () => {

    mode = "twoPlayer";

    twoPlayerBtn.classList.add("active");

    computerBtn.classList.remove("active");

    restartGame();

});


/* RESTART BUTTON */

restartBtn.addEventListener("click", restartGame);


/* START */

hideWinningLine();

</script>

</body>
</html>
